<div class="space-y-1.5">
  {%- if label %}
  <label class="text-sm font-medium" for="{{ name }}">{{ label }}</label>
  {%- endif %}
  <textarea
    id="{{ name }}"
    class="uk-textarea{% if error %} uk-form-destructive{% endif %}{% if monospace %} wf-monospace{% endif %}"
    name="{{ name }}"
    rows="{{ rows | default(4) }}"
    placeholder="{{ placeholder | default('') }}"
    spellcheck="false"
  ></textarea>
  {%- if error %}<p class="text-sm text-destructive">{{ error }}</p>{% endif %}
  {%- if hint %}<p class="text-sm text-muted-foreground">{{ hint }}</p>{% endif %}
</div>
