[project]
name = "workflow-core"
version = "0.1.0"
description = "Declarative, pipeline-based workflow runtime for Python web servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115", "python-multipart>=0.0.9"]
otel = ["opentelemetry-api>=1.0"]
redis = ["redis[asyncio]>=5.0"]

[tool.poetry]
packages = [{ include = "workflow_core", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.5"
black = "^24.0"
isort = "^5.0"
mypy = "^1.0"
uvicorn = "^0.29"
fastapi = "^0.115"
python-multipart = "^0.0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "src"
strict = true
